<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Connections - sql-pipeline</title>
    <link rel="stylesheet" href="/lib/bootstrap-5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">⇄ sql-pipeline</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/" data-i18n="nav.dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="/connections.html" data-i18n="nav.connections">Connections</a></li>
            <li class="nav-item"><a class="nav-link" href="/health-checks.html" data-i18n="nav.healthChecks">Health Checks</a></li>
            <li class="nav-item"><a class="nav-link" href="/releases.html" data-i18n="nav.releases">Releases</a></li>
            <li class="nav-item"><a class="nav-link" href="/notify.html" data-i18n="nav.notify">Alerts</a></li>
        </ul>
        <div class="d-flex align-items-center text-white-50">
            <span class="me-2 small" data-i18n="nav.operator">Operator</span>
            <input id="operatorInput" class="form-control form-control-sm" style="width:130px" placeholder="X-Operator">
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0" data-i18n="conn.title">Database Connections</h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#connModal" onclick="openCreate()" data-i18n="conn.create">+ New Connection</button>
    </div>

    <div class="card page-card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>connKey</th>
                    <th data-i18n="conn.col.name">Name</th>
                    <th>JDBC URL</th>
                    <th data-i18n="conn.field.username">Username</th>
                    <th>Schema</th>
                    <th data-i18n="conn.col.poolTimeout">Pool / Timeout</th>
                    <th>maxRows</th>
                    <th data-i18n="common.status">Status</th>
                    <th style="min-width:220px" data-i18n="common.actions">Actions</th>
                </tr>
                </thead>
                <tbody id="connTable"><tr><td colspan="10" class="text-center text-muted py-4" data-i18n="common.loading">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small" data-i18n="conn.footer.note"></p>
</div>

<!-- 新建/编辑连接 -->
<div class="modal fade" id="connModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="connModalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="connForm" class="row g-3">
                    <input type="hidden" id="connId">
                    <div class="col-md-4">
                        <label class="form-label">connKey <span class="text-danger">*</span></label>
                        <input id="fConnKey" class="form-control form-control-sm" maxlength="64">
                        <div class="form-text" id="connKeyHint">Unique reference name, immutable after creation</div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" data-i18n="conn.field.displayName">Display Name</label> <span class="text-danger">*</span>
                        <input id="fDisplayName" class="form-control form-control-sm" maxlength="128">
                    </div>
                    <div class="col-12">
                        <label class="form-label">JDBC URL <span class="text-danger">*</span></label>
                        <input id="fJdbcUrl" class="form-control form-control-sm mono" data-i18n-placeholder="conn.field.urlPlaceholder">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" data-i18n="conn.field.username">Username</label> <span class="text-danger">*</span>
                        <input id="fUsername" class="form-control form-control-sm" autocomplete="off">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" data-i18n="conn.field.schema">Default Schema</label>
                        <input id="fDefaultSchema" class="form-control form-control-sm mono" data-i18n-placeholder="conn.field.schemaPlaceholder" maxlength="64">
                        <div class="form-text" data-i18n="conn.field.schemaHint"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" data-i18n="conn.field.password">Password</label> <span class="text-danger" id="pwdRequired">*</span>
                        <input id="fPassword" type="password" class="form-control form-control-sm" autocomplete="new-password">
                        <div class="form-text" id="pwdHint" data-i18n="conn.field.passwordHint"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" data-i18n="conn.field.driver">Driver</label>
                        <input id="fDriverClass" class="form-control form-control-sm mono" value="org.postgresql.Driver">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">poolSize</label>
                        <input id="fPoolSize" type="number" class="form-control form-control-sm" value="10" min="1">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" data-i18n="conn.field.connTimeout">connTimeout(ms)</label>
                        <input id="fConnTimeout" type="number" class="form-control form-control-sm" value="5000" min="1000">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">maxRows</label>
                        <input id="fMaxRows" type="number" class="form-control form-control-sm" value="1000" min="1">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" data-i18n="conn.field.queryTimeout">queryTimeout(s)</label>
                        <input id="fQueryTimeout" type="number" class="form-control form-control-sm" value="30" min="1">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" data-i18n="common.status">Status</label>
                        <select id="fEnabled" class="form-select form-select-sm">
                            <option value="1" data-i18n="common.enable">Enable</option>
                            <option value="0" data-i18n="common.disable">Disable</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" data-i18n="common.cancel">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="saveConn()" data-i18n="conn.modal.save">Save & Register Pool</button>
            </div>
        </div>
    </div>
</div>

<script src="/lib/jquery/jquery-3.7.1.min.js"></script>
<script src="/lib/bootstrap-5.2.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/connections.js"></script>
</body>
</html>

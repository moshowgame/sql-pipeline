<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alerts - sql-pipeline</title>
    <link rel="stylesheet" href="/lib/bootstrap-5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">⇄ sql-pipeline</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/" data-i18n="nav.dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/connections.html" data-i18n="nav.connections">Connections</a></li>
            <li class="nav-item"><a class="nav-link" href="/health-checks.html" data-i18n="nav.healthChecks">Health Checks</a></li>
            <li class="nav-item"><a class="nav-link" href="/releases.html" data-i18n="nav.releases">Releases</a></li>
            <li class="nav-item"><a class="nav-link active" href="/notify.html" data-i18n="nav.notify">Alerts</a></li>
        </ul>
        <div class="d-flex align-items-center text-white-50">
            <span class="me-2 small" data-i18n="nav.operator">Operator</span>
            <input id="operatorInput" class="form-control form-control-sm" style="width:130px" placeholder="X-Operator">
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0" data-i18n="ntf.title">Alert Channels (xMatters API)</h5>
        <button class="btn btn-primary btn-sm" onclick="openCreate()" data-i18n="ntf.create">+ New Channel</button>
    </div>

    <div class="card page-card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th data-i18n="common.name">Name</th>
                    <th data-i18n="common.type">Type</th>
                    <th data-i18n="ntf.col.url">Trigger URL</th>
                    <th data-i18n="ntf.col.auth">Auth</th>
                    <th data-i18n="ntf.col.events">Events</th>
                    <th data-i18n="ntf.col.threshold">HC Streak Threshold</th>
                    <th data-i18n="common.status">Status</th>
                    <th style="min-width:200px" data-i18n="common.actions">Actions</th>
                </tr>
                </thead>
                <tbody id="channelTable"><tr><td colspan="9" class="text-center text-muted py-4" data-i18n="common.loading">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small" data-i18n="ntf.footer.note"></p>

    <h5 class="mt-4 mb-3" data-i18n="ntf.logs.title">Push Logs (latest 50)</h5>
    <div class="card page-card">
        <div class="card-body p-0">
            <table class="table table-sm table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th data-i18n="common.time">Time</th>
                    <th data-i18n="ntf.logs.col.channel">Channel</th>
                    <th data-i18n="ntf.logs.col.event">Event</th>
                    <th data-i18n="ntf.logs.col.title">Title</th>
                    <th data-i18n="rel.col.status">Status</th>
                    <th data-i18n="ntf.logs.col.response">Response / Error</th>
                </tr>
                </thead>
                <tbody id="logTable"><tr><td colspan="6" class="text-center text-muted py-4" data-i18n="common.loading">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 新建/编辑通道 -->
<div class="modal fade" id="channelModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="channelModalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="channelForm" class="row g-3">
                    <input type="hidden" id="channelId">
                    <div class="col-md-4">
                        <label class="form-label"><span data-i18n="common.name">Name</span> <span class="text-danger">*</span></label>
                        <input id="nName" class="form-control form-control-sm" maxlength="128">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" data-i18n="common.type">Type</label>
                        <select id="nType" class="form-select form-select-sm">
                            <option value="XMATTERS">xMatters API</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" data-i18n="common.status">Status</label>
                        <select id="nEnabled" class="form-select form-select-sm">
                            <option value="1" data-i18n="common.enable">Enable</option>
                            <option value="0" data-i18n="common.disable">Disable</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" data-i18n="ntf.field.threshold">HC Streak Threshold</label>
                        <input id="nThreshold" type="number" class="form-control form-control-sm" value="1" min="1">
                    </div>
                    <div class="col-12">
                        <label class="form-label"><span data-i18n="ntf.field.url">xMatters Trigger URL</span> <span class="text-danger">*</span></label>
                        <input id="nUrl" class="form-control form-control-sm mono"
                               placeholder="https://yourco.xmatters.com/api/integration/1/functions/{id}/trigger">
                        <div class="form-text" data-i18n="ntf.field.urlHint"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" data-i18n="ntf.field.auth">Auth Type</label>
                        <select id="nAuthType" class="form-select form-select-sm">
                            <option value="NONE" data-i18n="ntf.auth.none">NONE</option>
                            <option value="BASIC" data-i18n="ntf.auth.basic">BASIC</option>
                            <option value="API_KEY" data-i18n="ntf.auth.apiKey">API Key</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="usernameWrap">
                        <label class="form-label" data-i18n="ntf.field.username">Username (BASIC)</label>
                        <input id="nUsername" class="form-control form-control-sm" autocomplete="off">
                    </div>
                    <div class="col-md-3" id="headerWrap">
                        <label class="form-label" data-i18n="ntf.field.headerName">API Key Header Name</label>
                        <input id="nAuthHeader" class="form-control form-control-sm mono" value="apikey">
                    </div>
                    <div class="col-md-3" id="secretWrap">
                        <label class="form-label" id="secretLabel" data-i18n="ntf.field.secret">Password / API Key</label>
                        <input id="nSecret" type="password" class="form-control form-control-sm" autocomplete="new-password">
                        <div class="form-text" id="secretHint" data-i18n="ntf.field.secretHint"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" data-i18n="ntf.field.events">Subscribed Events</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input ev" type="checkbox" id="evHc" value="HC_FAIL" checked>
                            <label class="form-check-label" for="evHc" data-i18n="ntf.ev.hc">HC_FAIL</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input ev" type="checkbox" id="evStep" value="RELEASE_STEP_FAIL" checked>
                            <label class="form-check-label" for="evStep" data-i18n="ntf.ev.step">RELEASE_STEP_FAIL</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input ev" type="checkbox" id="evPlan" value="PLAN_FAIL" checked>
                            <label class="form-check-label" for="evPlan" data-i18n="ntf.ev.plan">PLAN_FAIL</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input ev" type="checkbox" id="evStepOk" value="RELEASE_STEP_SUCCESS">
                            <label class="form-check-label" for="evStepOk" data-i18n="ntf.ev.stepOk">RELEASE_STEP_SUCCESS</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input ev" type="checkbox" id="evPlanOk" value="PLAN_COMPLETED">
                            <label class="form-check-label" for="evPlanOk" data-i18n="ntf.ev.planOk">PLAN_COMPLETED</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" data-i18n="common.cancel">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="saveChannel()" data-i18n="common.save">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="/lib/jquery/jquery-3.7.1.min.js"></script>
<script src="/lib/bootstrap-5.2.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/notify.js"></script>
</body>
</html>

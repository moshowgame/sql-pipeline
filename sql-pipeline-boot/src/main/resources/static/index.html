<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sql-pipeline</title>
    <link rel="stylesheet" href="/lib/bootstrap-5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">⇄ sql-pipeline</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" href="/" data-i18n="nav.dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/connections.html" data-i18n="nav.connections">Connections</a></li>
            <li class="nav-item"><a class="nav-link" href="/health-checks.html" data-i18n="nav.healthChecks">Health Checks</a></li>
            <li class="nav-item"><a class="nav-link" href="/releases.html" data-i18n="nav.releases">Releases</a></li>
            <li class="nav-item"><a class="nav-link" href="/notify.html" data-i18n="nav.notify">Alerts</a></li>
        </ul>
        <div class="d-flex align-items-center text-white-50">
            <span class="me-2 small" data-i18n="nav.operator">Operator</span>
            <input id="operatorInput" class="form-control form-control-sm" style="width:130px" placeholder="X-Operator">
        </div>
    </div>
</nav>

<div class="container">
    <h5 class="mb-3" data-i18n="dash.title">Platform Overview</h5>
    <div class="row g-3 mb-4" id="summaryCards"></div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card page-card">
                <div class="card-header bg-white" data-i18n="dash.recentPlans">Recent Release Plans</div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="table-light"><tr>
                            <th>ID</th>
                            <th data-i18n="rel.col.planName">Plan Name</th>
                            <th data-i18n="rel.col.status">Status</th>
                            <th data-i18n="rel.col.operator">Operator</th>
                            <th data-i18n="rel.col.startedAt">Start Time</th>
                        </tr></thead>
                        <tbody id="recentPlans"><tr><td colspan="5" class="text-center text-muted py-3" data-i18n="common.loading">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card page-card">
                <div class="card-header bg-white" data-i18n="dash.platformInfo">Platform Info</div>
                <div class="card-body">
                    <div class="mb-1"><span class="kv-label" data-i18n="dash.info.health">Health endpoint</span><span class="mono" id="healthInfo"></span></div>
                    <div class="mb-1"><span class="kv-label" data-i18n="dash.info.metaDb">Metadata DB</span><span class="text-muted" data-i18n="dash.info.metaDbValue">PostgreSQL</span></div>
                    <div class="mb-1"><span class="kv-label" data-i18n="dash.info.operatorTip">Operator identity</span><span class="text-muted" data-i18n="dash.info.operatorValue"></span></div>
                    <div class="mb-1"><span class="kv-label" data-i18n="dash.info.tip">Tips</span><span class="text-muted" data-i18n="dash.info.tipValue"></span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/lib/jquery/jquery-3.7.1.min.js"></script>
<script src="/lib/bootstrap-5.2.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>

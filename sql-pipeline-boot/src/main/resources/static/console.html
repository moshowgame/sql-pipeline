        </div>

<div class="container">
    <h5 class="mb-3" data-i18n="console.title">SQL Console</h5>

    <div class="card page-card">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <label class="form-label mb-0 small text-muted" for="connSelect" data-i18n="console.conn">Connection</label>
                <select id="connSelect" class="form-select form-select-sm" style="width:auto;min-width:220px"></select>
                <label class="form-label mb-0 small text-muted ms-2" for="maxRowsInput" data-i18n="console.maxRows">Max rows</label>
                <input id="maxRowsInput" type="number" class="form-control form-control-sm" style="width:100px" value="200" min="1" max="1000">
                <div class="ms-auto btn-group btn-group-sm">
                    <button id="btnRun" class="btn btn-success" onclick="runSql()" title="Ctrl+Enter">▶ <span data-i18n="console.run">Run</span></button>
                    <button class="btn btn-outline-secondary" onclick="toggleConsoleTheme()" title="Light / dark theme">◐</button>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#historyPanel" aria-expanded="false">
                    🕘 <span data-i18n="console.history">History</span> <span id="historyCount" class="badge bg-secondary"></span>
                </button>
                <button class="btn btn-outline-danger btn-sm" type="button" onclick="clearHistory()" data-i18n="console.clearHistory">Clear history</button>
                <span class="text-muted small ms-2" data-i18n="console.hint">SELECT only · multiple statements allowed · Ctrl+Enter to run</span>
            </div>
            <div class="collapse mb-2" id="historyPanel">
                <div class="border rounded p-2 bg-light" style="max-height:200px;overflow-y:auto">
                    <ul class="list-unstyled mb-0 small" id="historyList"></ul>
                </div>
            </div>
            <textarea id="consoleSql" class="form-control form-control-sm sql-text" rows="6"
                      placeholder="SELECT * FROM t LIMIT 10;"></textarea>
            <div id="consoleResults" class="mt-3"></div>
        </div>
    </div>
</div>

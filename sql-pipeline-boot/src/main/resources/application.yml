server:
  port: 8080

spring:
  application:
    name: sql-pipeline
  datasource:
    # 平台元数据库（PostgreSQL）：连接定义、健康检查定义、发布计划等全部配置存于此库
    # stringtype=unspecified 便于 MyBatis 直接写 jsonb 列
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root123}
    hikari:
      maximum-pool-size: 20
      pool-name: platform-meta-pool
      # 平台元数据库默认 Schema（schema 不是库名！库名由上面 url 的 DB_NAME 控制）。
      # 配置的 schema 不存在时会在连接建立时自动创建（connection-init-sql），无需手工建。
      # 可用环境变量 DB_SCHEMA 覆盖。
      schema: ${DB_SCHEMA:sql_pipeline}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:sql_pipeline}
  sql:
    init:
      # 幂等建表（CREATE TABLE IF NOT EXISTS），首次启动自动初始化
      mode: always

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

spring.messages:
  basename: messages
  encoding: UTF-8
  # 缺失 key 时回退到 messages.properties（英文），不跟随系统语言
  fallback-to-system-locale: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

sql-pipeline:
  crypto:
    # AES-256 密钥（Base64 的 32 字节），生成：openssl rand -base64 32
    key: ${SQL_PIPELINE_AES_KEY:gqclw7YITwnF6PJ9L0FCmX5UFJcWfyZvviPg+Xv8+Sw=}
  datasource:
    # P0 池容量全库预算：同一目标库（按规范化 jdbc_url 归组）所有启用连接的 pool_size 之和
    # 不得超过该值，超限保存报 DS0004；多实例部署请下调并引入 PgBouncer
    pool-budget-per-url: 20
    # P0 流式读取：autoCommit=false + fetchSize>0 时 pgjdbc 按游标分批拉取结果集
    fetch-size: 500
    # 新建连接默认 pool_size（P0 由 10 下调）
    default-pool-size: 8
  release:
    # 发布目录根路径：其下每个 release_YYYYMMDD 目录为一个发布计划
    base-path: ${RELEASE_BASE_PATH:./data/releases}
    sql-suffix: .sql
    max-steps: 99
    statement-timeout-sec: 60
  health:
    scheduler:
      # 默认 TaskScheduler 池大小为 1，必须显式设置避免慢任务互相阻塞
      pool-size: 8
    default-timeout-sec: 30
    default-max-rows: 1000
  auth:
    # 简易登录认证：登录后签发 HMAC Token 并写入 HttpOnly Cookie（有效期=token-ttl，默认 1 天）
    enabled: true
    # Token 签名密钥，生产环境务必通过环境变量覆盖
    token-secret: ${AUTH_TOKEN_SECRET:sql-pipeline-default-secret-please-change}
    token-ttl: 24h
    cookie-name: AUTH_TOKEN
    # 内置用户（启动时不存在则自动创建，密码入库前经 BCrypt 加密）——快速添加用户只需加一行
    default-users:
      admin: admin123
      dev: dev123
    # self-TPAM 自助临时账号：管理员输入 CR/IN 单号 + staffid，生成 staffid_tpam 限时账号（support 场景）
    tpam:
      enabled: true
      # 临时账号有效期（小时），默认 4 小时，到点自动回收删除
      ttl-hours: 4
    # LDAP/AD 企业目录登录（扩展模块 sql-pipeline-ldap）：默认关闭，开启后目录账号首次登录自动开通（默认 VIEWER）
    # 开启时本地 default-users 仍可用作兜底；目录服务不可用默认降级回退本地校验（fail-closed: true 改为拒绝登录）
    ldap:
      enabled: false
      # url: ldap://ad.corp.com:389          # 或 ldaps://ad.corp.com:636（需 CA 证书入 JVM truststore）
      # base-dn: DC=corp,DC=com
      # user-search-filter: (sAMAccountName={0})
      # manager-dn: CN=svc-sqlpipe,OU=Service,DC=corp,DC=com   # 只读服务账号（search-then-bind）
      # manager-password: ${LDAP_MANAGER_PASSWORD:}
      # admin-groups:                          # 命中任一组首次开通为 ADMIN，否则 default-role
      #   - CN=DBA-Admins,OU=Groups,DC=corp,DC=com
      # default-role: VIEWER
      # connect-timeout-ms: 3000
      # read-timeout-ms: 5000
      # start-tls: false
      # fail-closed: false

logging:
  level:
    com.sqlpipeline: INFO
